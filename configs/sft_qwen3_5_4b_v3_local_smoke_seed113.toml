[sft]
# Local RTX 4060 compatibility smoke test only. This is not a formal result.
run_id = "qwen3.5-4b-v3-local-smoke-seed113"
model_id = "Qwen/Qwen3.5-4B"
dataset_path = "data/generated/v3_search_discovered_sft_custom_v1.jsonl"
output_dir = "outputs/sft/qwen3_5_4b_v3_local_smoke_seed113/adapter"
metrics_path = "artifacts/metrics/qwen3_5_4b_v3_local_smoke_seed113.json"
seed = 113

# One example and one optimizer update are enough to exercise tokenization,
# assistant-only masking, forward/backward passes, and adapter serialization.
sample_count = 1
max_length = 1280
max_steps = 1
learning_rate = 0.0001
batch_size = 1
gradient_accumulation_steps = 1
max_grad_norm = 1.0

# Match the formal V3 runs so module compatibility is tested honestly.
lora_rank = 16
lora_alpha = 32
lora_dropout = 0.0
target_modules = [
  "q_proj", "k_proj", "v_proj", "o_proj",
  "in_proj_qkv", "in_proj_z", "in_proj_b", "in_proj_a", "out_proj",
  "gate_proj", "up_proj", "down_proj",
]

checkpoint_steps = []
