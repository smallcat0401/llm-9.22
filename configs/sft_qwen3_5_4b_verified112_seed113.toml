[sft]
run_id = "qwen3.5-4b-qlora-verified112-seed113"
model_id = "Qwen/Qwen3.5-4B"
dataset_path = "data/generated/qwen3_5_4b_sft_train_path_aligned_merged112.jsonl"
output_dir = "outputs/sft/qwen3_5_4b_qlora_verified112_seed113/adapter"
metrics_path = "artifacts/metrics/qwen3_5_4b_qlora_verified112_seed113.json"
seed = 113
sample_count = 112
max_length = 1024

# Batch size 1 is the conservative 24 GB rental-GPU setting. There are 112
# micro-batches per epoch; 336 steps are exactly three passes over the dataset.
max_steps = 336
learning_rate = 0.0001
batch_size = 1
gradient_accumulation_steps = 8
max_grad_norm = 1.0

lora_rank = 16
lora_alpha = 32
lora_dropout = 0.0
target_modules = [
  "q_proj", "k_proj", "v_proj", "o_proj",
  "in_proj_qkv", "in_proj_z", "in_proj_b", "in_proj_a", "out_proj",
  "gate_proj", "up_proj", "down_proj",
]

# These are one-epoch and two-epoch checkpoints. The final adapter is epoch 3.
checkpoint_steps = [112, 224]
